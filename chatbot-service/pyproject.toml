[project]
name = "org-faq-chatbot-service"
version = "0.1.0"
description = "FAQ chatbot service with E-Branchformer voice input for the Organization website (SRS Release 2)"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # File(...) in defaults is the FastAPI idiom
  "SIM905", # a split string is easier to read for the stopword list
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N801"]
"eval/*" = ["S"]
"scripts/*" = ["S"]
